name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Format-valid, non-secret Clerk frontend identifier for prerender validation.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Z3Jhc3AtY2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_placeholder
          DATABASE_URL: postgresql://user:password@localhost:5432/grasp
          ENCRYPTION_KEY: ci-only-placeholder-key
          OPEN_LIBRARY_CONTACT_EMAIL: ci@example.com
